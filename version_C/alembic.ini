; Setuk-AI version_C schema migrations.
;
; NOTE: keep this file ASCII-only. Alembic reads alembic.ini with the OS locale
; encoding (cp949 on Korean Windows), so non-ASCII comments here raise
; UnicodeDecodeError before any migration runs. Korean notes live in alembic/env.py,
; which is read as UTF-8 Python source.
;
; The connection string is NOT stored here -- alembic/env.py reads DATABASE_URL
; (version_C/.env) so that passwords never land in the repository.
;
; Usage (from version_C/):
;   alembic upgrade head
;   alembic revision --autogenerate -m "message"

[alembic]
script_location = alembic
prepend_sys_path = ..
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
