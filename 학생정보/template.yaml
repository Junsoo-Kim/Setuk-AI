  name: ""
  grade: ""
  class: ""
  number: ""

subject:
  name: ""
  semester: ""
  teacher: ""

# 수업에서 관찰한 내용을 활동 단위로 작성합니다.
# 활동이 여러 개라면 아래 묶음을 복사해 목록에 추가하세요.
# 행동 기록에 참고할 수 있는 동사 예시:
# 질문함, 탐색함, 비교함, 분류함, 분석함, 적용함, 설계함, 측정함,
# 검증함, 해석함, 설명함, 발표함, 제안함, 수정함, 협력함, 성찰함
# 실제로 관찰하지 않은 행동을 동사 목록에 맞추어 만들어 내지는 마세요.
activities:
  - topic: ""
    motivation: ""
    process: []
    evidence: []
    result: ""
    competencies: []
    growth: ""
    teacher_observation: ""

# 글 전체에 반영할 교사의 종합 관찰입니다.
overall_observation: ""

# 반드시 지켜야 할 작성 조건이 있을 때만 입력합니다.
requirements:
  target_bytes: null
  emphasis: []
  exclude: []
